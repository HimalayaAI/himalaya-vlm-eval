name: Images

# Publishes the results API image to GHCR for the studio deploy, tagged with the short
# commit sha like the studio's other images (ghcr.io/himalayaai/<name>:<sha>).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  himalaya-vlm-eval-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/himalayaai/himalaya-vlm-eval-api:${{ steps.tag.outputs.sha }}
            ghcr.io/himalayaai/himalaya-vlm-eval-api:latest
