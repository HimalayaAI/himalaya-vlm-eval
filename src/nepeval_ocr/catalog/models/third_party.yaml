# Third-party VLMs through OpenRouter (one key, one API). Ids verified against
# https://openrouter.ai/api/v1/models on 2026-10-06. Anything not listed here can be run
# ad hoc as `openrouter:<vendor>/<model>`; add it here once it should carry metadata.
#
# Reasoning models get temperature: null (several reject it) and a larger token budget.

# --- OpenAI ------------------------------------------------------------------------------
- id: gpt-4o
  display_name: GPT-4o
  org: OpenAI
  open_weights: false
  endpoint: openrouter:openai/gpt-4o
  adapter: openai_compat
  params: &openrouter
    model: openai/gpt-4o
    base_url: https://openrouter.ai/api/v1
    api_key_env: [OPENROUTER_API_KEY]
    concurrency: 8

- id: gpt-4.1
  display_name: GPT-4.1
  org: OpenAI
  open_weights: false
  endpoint: openrouter:openai/gpt-4.1
  adapter: openai_compat
  params: {<<: *openrouter, model: openai/gpt-4.1}

- id: gpt-4.1-mini
  display_name: GPT-4.1 mini
  org: OpenAI
  open_weights: false
  endpoint: openrouter:openai/gpt-4.1-mini
  adapter: openai_compat
  params: {<<: *openrouter, model: openai/gpt-4.1-mini}

- id: gpt-5
  display_name: GPT-5
  org: OpenAI
  open_weights: false
  endpoint: openrouter:openai/gpt-5
  adapter: openai_compat
  params: &reasoning {<<: *openrouter, model: openai/gpt-5, temperature: null, max_tokens: 16384}

- id: gpt-5-mini
  display_name: GPT-5 mini
  org: OpenAI
  open_weights: false
  endpoint: openrouter:openai/gpt-5-mini
  adapter: openai_compat
  params: {<<: *reasoning, model: openai/gpt-5-mini}

- id: gpt-5.5
  display_name: GPT-5.5
  org: OpenAI
  open_weights: false
  endpoint: openrouter:openai/gpt-5.5
  adapter: openai_compat
  params: {<<: *reasoning, model: openai/gpt-5.5}

