# The endpoint the earlier himalaya-vlm-eval scripts benchmarked: the same Gemma 4 E2B
# fine-tune as himalaya-gemma-4-bf16, served elsewhere (confirmed 2026-10-13).
- id: himalaya-bf16-scalabs
  display_name: himalaya-bf16 (Scalabs endpoint)
  org: HimalayaAI
  kind: vlm
  params_b: 5.12
  endpoint: scalabs:/chat/completions
  adapter: openai_compat
  params:
    model: scalabs/himalaya-bf16
    base_url: https://himalayagpt.api.scalabs.ai/v1
    api_key_env: [TARKA_API_KEY, HIMEVAL_API_TOKEN, OPENAI_API_KEY]
    max_tokens: 1024
    concurrency: 4
