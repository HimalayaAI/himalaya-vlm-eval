# The comparison set: open vision-language models in our size class, run by this harness
# (picked 2026-10-13). The leaderboard ranks only models listed in the catalog
# (`catalog.board_models()`), so this file *is* who our models are measured against.
#
# Size class: 1–5B total parameters, the class of himalaya-gemma-4 (Gemma 4 E2B, 5.12B) and
# glm-ocr-nepali (1.33B). `params_b` is the safetensors total on Hugging Face, embeddings
# included — the same definition as catalog/models/himalaya.yaml, read on 2026-10-13. A
# frontier model can still be run ad hoc (`openrouter:<vendor>/<model>`); it is stored, and
# it is not ranked here.
#
# Reached two ways: OpenRouter where it serves the model; otherwise a vLLM server we run
# (`base_url_env: VLLM_BASE_URL`, one model per server, e.g.
# `vllm serve google/gemma-4-E2B-it`), since these small models have no public API.
#
# Indic models in the class are tracked as issues until their adapters exist: Sarvam Vision
# (3B, API-only, asynchronous document jobs, `ne-IN`) and Bodhan IndicOCR (0.8B, open
# weights, a layout + OCR pipeline, lists `ne` and `mai`).

# --- the untuned base of himalaya-gemma-4 -----------------------------------------------
# The row that shows what our training added.
- id: gemma-4-e2b-it
  display_name: Gemma 4 E2B
  org: Google
  open_weights: true
  params_b: 5.12  # google/gemma-4-E2B-it, 5,123,178,051
  license: Apache-2.0
  url: https://huggingface.co/google/gemma-4-E2B-it
  endpoint: vllm:google/gemma-4-E2B-it
  adapter: openai_compat
  params: &vllm
    model: google/gemma-4-E2B-it
    base_url_env: VLLM_BASE_URL
    api_key_env: null
    concurrency: 16

# --- Alibaba -----------------------------------------------------------------------------
# Qwen3.5 small models think by default; the benchmarks compare direct answers, so
# thinking is turned off through the chat template (vLLM's `chat_template_kwargs`).
- id: qwen3.5-2b
  display_name: Qwen3.5 2B
  org: Alibaba
  open_weights: true
  params_b: 2.27  # Qwen/Qwen3.5-2B, 2,274,069,824
  license: Apache-2.0
  url: https://huggingface.co/Qwen/Qwen3.5-2B
  endpoint: vllm:Qwen/Qwen3.5-2B
  adapter: openai_compat
  params: &qwen
    <<: *vllm
    model: Qwen/Qwen3.5-2B
    extra_body: {chat_template_kwargs: {enable_thinking: false}}

- id: qwen3.5-4b
  display_name: Qwen3.5 4B
  org: Alibaba
  open_weights: true
  params_b: 4.66  # Qwen/Qwen3.5-4B, 4,659,865,088
  license: Apache-2.0
  url: https://huggingface.co/Qwen/Qwen3.5-4B
  endpoint: vllm:Qwen/Qwen3.5-4B
  adapter: openai_compat
  params: {<<: *qwen, model: Qwen/Qwen3.5-4B}

# --- Mistral AI --------------------------------------------------------------------------
- id: ministral-3-3b
  display_name: Ministral 3 3B
  org: Mistral AI
  open_weights: true
  params_b: 3.85  # mistralai/Ministral-3-3B-Instruct-2512, 3,849,090,048
  license: Apache-2.0
  url: https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512
  endpoint: openrouter:mistralai/ministral-3b-2512
  adapter: openai_compat
  params: &openrouter
    model: mistralai/ministral-3b-2512
    base_url: https://openrouter.ai/api/v1
    api_key_env: [OPENROUTER_API_KEY]
    concurrency: 8

# --- Google (previous generation) --------------------------------------------------------
- id: gemma-3-4b-it
  display_name: Gemma 3 4B
  org: Google
  open_weights: true
  params_b: 4.3  # google/gemma-3-4b-it, 4,300,079,472
  license: Gemma
  url: https://huggingface.co/google/gemma-3-4b-it
  endpoint: openrouter:google/gemma-3-4b-it
  adapter: openai_compat
  params: {<<: *openrouter, model: google/gemma-3-4b-it}
