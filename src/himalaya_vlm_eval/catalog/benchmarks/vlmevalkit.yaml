# Standard VLM benchmarks run through VLMEvalKit, so numbers are produced the same way as
# the OpenCompass OpenVLM leaderboard (same prompts, answer extraction and scoring).
#
# `vlmeval` tells the engine how to run and where the headline score lands:
#   dataset   VLMEvalKit dataset name
#   files     globs tried in order inside the run dir; {P} = <model alias>_<dataset>
#   json_key  for JSON results;  column (+ optional row {col: value}) for CSV/TSV results
#   sum       add several columns (MME)
#   multiply  rescale to the declared scale (VLMEvalKit mixes 0–1 and 0–100)
#   percent   value is a string like "45.33%"
#   judge     required | extract | none — LLM judge use (extract = answer extraction only,
#             falls back to exact matching without a judge)
# Facts verified against VLMEvalKit main @ 54a063c5 (2026-09-30); see docs/VLMEVALKIT.md.

# --- OCR -----------------------------------------------------------------------------------
- id: ocrbench
  engine: vlmevalkit
  display_name: OCRBench
  category: ocr
  description: 1000 questions over text recognition, scene-text VQA, document VQA, KIE and handwritten math; score out of 1000.
  url: https://github.com/Yuliang-Liu/MultimodalOCR
  primary_metric: score
  scale_max: 1000
  vlmeval: {dataset: OCRBench, files: ["{P}_score.json"], json_key: Final Score, judge: none}

- id: ocrbench-v2-en
  engine: vlmevalkit
  display_name: OCRBench v2 (EN)
  category: ocr
  description: OCRBench v2 English tasks — recognition, referring, spotting, extraction, parsing, reasoning.
  url: https://github.com/Yuliang-Liu/MultimodalOCR
  primary_metric: score
  vlmeval: {dataset: OCRBench_v2, files: ["{P}_score.json"], json_key: English Overall Score, multiply: 100, judge: none}

- id: ocrbench-v2-zh
  engine: vlmevalkit
  display_name: OCRBench v2 (ZH)
  category: ocr
  language: zh
  description: OCRBench v2 Chinese tasks.
  url: https://github.com/Yuliang-Liu/MultimodalOCR
  primary_metric: score
  vlmeval: {dataset: OCRBench_v2, files: ["{P}_score.json"], json_key: Chinese Overall Score, multiply: 100, judge: none}

- id: ccocr
  engine: vlmevalkit
  display_name: CC-OCR
  category: ocr
  language: multi
  description: Multilingual text reading, scene OCR, key information extraction and document parsing; mean of the four tracks.
  url: https://github.com/AlibabaResearch/AdvancedLiterateMachinery
  primary_metric: score
  vlmeval: {dataset: CCOCR, files: ["{P}_acc.csv"], column: total, multiply: auto, judge: none}

- id: olmocrbench
  engine: vlmevalkit
  display_name: olmOCR-Bench
  category: ocr
  board: document/parsing
  description: Unit-test-style checks on PDF page conversion (text presence/absence, order, tables, math). Needs VLMEvalKit's olmOCRBench eval requirements.
  url: https://github.com/allenai/olmocr
  primary_metric: pass_rate
  vlmeval: {dataset: olmOCRBench, files: ["olmOCRBench_eval_summary.csv"], row: {type: overall}, column: score, judge: none}

- id: textvqa-val
