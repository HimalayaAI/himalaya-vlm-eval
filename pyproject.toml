[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "himalaya-vlm-eval"
version = "0.2.0"
description = "Benchmark harness and results API for OCR, document, chart, math and chat VLM benchmarks, Nepali-first."
readme = "README.md"
requires-python = ">=3.10"
# The core is what the results API needs: schema + leaderboard logic. Everything that
# loads datasets or talks to models is an extra, so the API image stays small.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
run = [
    "datasets>=2.18",
    "huggingface_hub>=0.23",
    "Pillow>=10",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
s3 = [
    "boto3>=1.34",
]
tesseract = ["pytesseract"]
easyocr = ["easyocr", "torch", "torchvision"]
# PaddleOCR also needs paddlepaddle, which is not on PyPI:
# https://www.paddlepaddle.org.cn/en/install/quick
paddle = ["paddleocr>=2.0"]
surya = ["surya-ocr"]
trocr = ["transformers", "torch"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "Pillow>=10",
    "rapidfuzz>=3.6",
]

[project.scripts]
himeval = "himalaya_vlm_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/himalaya_vlm_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is the idiom
    "RUF001",  # Devanagari and typographic characters are intentional
    "RUF002",
    "RUF003",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
